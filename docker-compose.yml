version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-ttl

volumes:
  mongo_data:
